<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Document</title>
</head>
<body>
<form action=" " method="post">

    <table  cellspecing="10" cellpadding="10">

    </select></td>

   <td>Address</td>
